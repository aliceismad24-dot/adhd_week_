*{box-sizing:border-box;}
html{font-size:16px;-webkit-text-size-adjust:100%;}
html[data-large="1"]{font-size:18.5px;}
html,body{margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--ui);font-size:.9375rem;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh;}
::selection{background:#fff;color:#000;}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}
.display{font-family:var(--disp);font-weight:700;letter-spacing:-.03em;line-height:1;}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum";}
.sr-only{position:absolute!important;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
.skip{position:absolute;left:.75rem;top:-4rem;background:#fff;color:#000;padding:.6rem 1rem;border-radius:var(--r-sm);z-index:500;font-weight:700;}
.skip:focus{top:.75rem;}
:focus-visible{outline:2px solid #fff;outline-offset:2px;}
a{color:inherit;}
[hidden]{display:none!important;}

/* ---------- shell ---------- */
.shell{display:flex;min-height:100vh;}
.sidebar{position:fixed;top:0;left:0;bottom:0;width:var(--sidebar-w);background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:1.3rem .8rem 1rem;z-index:50;overflow-y:auto;}
.sb-brand{display:flex;align-items:center;gap:.7rem;padding:0 .5rem 1.1rem;}
.logo-mark{width:2.6rem;height:1.5rem;background:var(--logo) center/contain no-repeat;opacity:.9;flex:0 0 auto;}
.sb-brand .t1{display:block;font-size:.65rem;letter-spacing:.17em;text-transform:uppercase;color:var(--dim);font-weight:600;}
.sb-brand .t3{display:block;font-size:.82rem;color:var(--muted);line-height:1.3;margin-top:.2rem;}
.sb-brand .t2{display:block;font-family:var(--disp);font-size:.95rem;font-weight:700;letter-spacing:-.02em;line-height:1.15;}
.sb-group{font-size:.65rem;letter-spacing:.17em;text-transform:uppercase;color:var(--dim);padding:.95rem .65rem .4rem;font-weight:600;}
.nav-btn{display:flex;align-items:center;gap:.7rem;width:100%;text-align:left;background:transparent;border:1px solid transparent;color:var(--muted);padding:.55rem .7rem;border-radius:var(--r-sm);cursor:pointer;font-weight:600;font-size:.85rem;min-height:2.4rem;transition:background var(--t) ease,color var(--t) ease,transform var(--t-fast) ease,border-color var(--t) ease;}
.nav-btn .ic{width:1.05rem;height:1.05rem;flex:0 0 auto;opacity:.8;}
.nav-btn:hover{background:var(--raised);color:var(--text);}
.nav-btn:active{transform:scale(.975);}
.nav-btn[aria-current="page"]{background:var(--card2);color:var(--text);border-color:var(--line2);}
.nav-btn[aria-current="page"] .ic{opacity:1;}
.nav-btn .badge{margin-left:auto;font-size:.68rem;background:#fff;color:#000;border-radius:999px;padding:.05rem .45rem;font-weight:700;}
.sb-foot{margin-top:auto;padding:.9rem .65rem 0;border-top:1px solid var(--line);font-size:.82rem;color:var(--muted);line-height:1.5;}
.corner-logo{position:fixed;top:14px;right:22px;width:78px;height:42px;background:var(--logo) center/contain no-repeat;opacity:.13;pointer-events:none;z-index:40;}
.mobilebar{display:none;}

.content{flex:1;margin-left:var(--sidebar-w);min-width:0;}
.inner{max-width:72rem;margin:0 auto;padding:2.1rem 2.25rem 5.5rem;}
main:focus{outline:none;}
.page.anim{animation:vin 170ms cubic-bezier(.2,.7,.3,1);}
@keyframes vin{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
.page-head{margin-bottom:1.6rem;}
.eyebrow{display:flex;align-items:center;gap:.5rem;font-size:.76rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:.7rem;font-weight:600;}
.eyebrow .dot{width:5px;height:5px;border-radius:50%;background:var(--accent2);}
h1.pt{font-family:var(--disp);font-size:2.15rem;font-weight:700;letter-spacing:-.035em;line-height:1.02;margin:0 0 .5rem;}
.ps{color:var(--muted);margin:0;max-width:40rem;line-height:1.55;}
h2.st{font-family:var(--disp);font-size:1.1rem;letter-spacing:-.02em;margin:2.2rem 0 .9rem;font-weight:700;display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;}
h2.st .grow{flex:1;}
.page-head + h2.st{margin-top:0;}
.lbl{font-size:.76rem;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:600;}
.muted{color:#fff;} .dim{color:var(--muted);}
.sm{font-size:.92rem;}
.dec{font-size:.55em;letter-spacing:0;opacity:.85;}

/* ---------- hero + bento ---------- */
.hero{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:var(--r-lg);background:radial-gradient(120% 150% at 12% 0%,rgba(255,255,255,.13) 0%,rgba(255,255,255,.035) 36%,transparent 66%),linear-gradient(160deg,#141414 0%,#0C0C0C 60%);padding:2rem 2.25rem;margin-bottom:1rem;}
.hero::after{content:"";position:absolute;left:-10%;top:-60%;width:60%;height:190%;background:radial-gradient(closest-side,rgba(255,255,255,.13),transparent 70%);filter:blur(26px);pointer-events:none;}
.hero-grid{position:relative;z-index:1;display:grid;grid-template-columns:1.3fr .7fr;gap:1.75rem;align-items:center;}
.pill{display:inline-flex;align-items:center;gap:.5rem;padding:.35rem .85rem;border-radius:999px;border:1px solid var(--line2);background:rgba(255,255,255,.04);font-size:.75rem;color:var(--muted);margin-bottom:1rem;}
.pill i{width:6px;height:6px;border-radius:50%;background:var(--accent2);display:inline-block;}
.hero-num{font-family:var(--disp);font-weight:700;font-size:clamp(2.6rem,6.5vw,4.7rem);line-height:.92;margin:.4rem 0 .8rem;letter-spacing:-.04em;overflow-wrap:anywhere;}
.hero-sub{color:#fff;max-width:30rem;font-size:1rem;line-height:1.5;margin:0;}
.hero-right{display:flex;flex-direction:column;gap:.7rem;}
.hero-stat{background:rgba(255,255,255,.035);border:1px solid var(--line2);border-radius:var(--r);padding:.85rem 1rem;}
.hero-stat .hv{font-family:var(--disp);font-size:1.35rem;font-weight:700;letter-spacing:-.025em;margin-top:.3rem;overflow-wrap:anywhere;}
.hero-stat .hd{font-size:.88rem;color:var(--muted);margin-top:.15rem;}
.bento{display:grid;grid-template-columns:repeat(4,1fr);gap:.9rem;}
.b{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:1.1rem 1.25rem;min-width:0;transition:border-color var(--t) ease;}
.b:hover{border-color:var(--line2);}
.b.s2{grid-column:span 2;} .b.s3{grid-column:span 3;} .b.s4{grid-column:span 4;}
.b .bv{font-family:var(--disp);font-size:1.75rem;font-weight:700;letter-spacing:-.03em;line-height:1.05;margin-top:.55rem;overflow-wrap:anywhere;}
.b .bd{font-size:1rem;font-weight:500;color:#FFFFFF;margin-top:.55rem;line-height:1.5;}
.b h3{margin:0;font-size:.76rem;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:.5rem;}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:.8rem;}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width 300ms cubic-bezier(.3,.8,.3,1);}
.bar.over i{background:repeating-linear-gradient(45deg,#fff,#fff 4px,#888 4px,#888 8px);}
.mini-list{list-style:none;margin:.7rem 0 0;padding:0;display:flex;flex-direction:column;gap:.15rem;}
.mini-list li{display:flex;align-items:center;gap:.6rem;padding:.45rem 0;border-bottom:1px solid var(--line);font-size:.96rem;min-width:0;}
.mini-list li:last-child{border-bottom:0;}
.mini-list .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.mini-list .amt{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap;}
.attn{display:flex;gap:.7rem;align-items:flex-start;padding:.6rem 0;border-bottom:1px solid var(--line);font-size:.96rem;line-height:1.5;}
.attn:last-child{border-bottom:0;}
.attn .ic{width:1rem;height:1rem;flex:0 0 auto;margin-top:.15rem;opacity:.85;}
.attn .grow{flex:1;}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;background:var(--raised);border:1px solid var(--line2);color:var(--text);padding:.6rem 1.05rem;min-height:2.6rem;border-radius:var(--r-sm);cursor:pointer;font-weight:600;font-size:.86rem;line-height:1.1;transition:transform var(--t-fast) ease,background var(--t) ease,border-color var(--t) ease,opacity var(--t) ease;}
.btn:hover{border-color:var(--line3);background:var(--card2);}
.btn:active{transform:scale(.965);}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed;transform:none;}
.btn .ic{width:1rem;height:1rem;}
.btn-primary{background:#fff;color:#000;border-color:#fff;font-weight:700;}
.btn-primary:hover{background:#E2E2E2;border-color:#E2E2E2;}
.btn-ghost{background:transparent;}
.btn-danger{border-color:#fff;}
.btn-sm{min-height:2.1rem;padding:.35rem .75rem;font-size:.8rem;}
.btn-row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:2.2rem;height:2.2rem;background:transparent;border:1px solid var(--line2);border-radius:var(--r-sm);cursor:pointer;color:var(--muted);transition:transform var(--t-fast) ease,border-color var(--t) ease,color var(--t) ease,background var(--t) ease;flex:0 0 auto;}
.icon-btn:hover{color:#fff;border-color:var(--line3);background:var(--card2);}
.icon-btn:active{transform:scale(.9);}
.icon-btn .ic{width:1rem;height:1rem;}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem;}
.qbtn{display:flex;align-items:center;justify-content:space-between;gap:.6rem;background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);padding:.85rem 1rem;min-height:3rem;cursor:pointer;font-weight:600;font-size:.88rem;text-align:left;transition:transform var(--t-fast) ease,border-color var(--t) ease,background var(--t) ease;}
.qbtn:hover{border-color:var(--line3);background:var(--card2);}
.qbtn:active{transform:scale(.975);}
.qbtn .ic{width:1rem;height:1rem;color:var(--dim);}

/* ---------- tags / status ---------- */
.tag{display:inline-flex;align-items:center;gap:.35rem;padding:.12rem .6rem;border-radius:999px;border:1px solid var(--line3);font-size:.8rem;font-weight:600;color:var(--muted);white-space:nowrap;}
.tag.t-overdue{background:#fff;color:#000;border-color:#fff;}
.tag.t-soon{color:#fff;border-color:#9a9a9a;}
.tag.t-paid,.tag.t-received{color:var(--dim);}
.tag.t-expected{border-style:dashed;color:var(--muted);}
.tag.t-warn{border-color:#fff;color:#fff;}

/* ---------- record lists ---------- */
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--card);overflow:hidden;}
.rec{display:flex;align-items:center;gap:.9rem;padding:.8rem 1rem;border-bottom:1px solid var(--line);}
.rec:last-child{border-bottom:0;}
.rec:hover{background:rgba(255,255,255,.02);}
.rec .main{flex:1;min-width:0;}
.rec .ttl{font-weight:600;overflow-wrap:anywhere;}
.rec .meta{font-size:.88rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:.2rem .7rem;margin-top:.15rem;}
.rec .amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right;}
.rec .amt small{display:block;font-weight:400;font-size:.82rem;color:var(--muted);}
.rec .acts{display:flex;gap:.35rem;flex:0 0 auto;}
.rec.done .ttl{text-decoration:line-through;color:var(--dim);}
.rec.faded{opacity:.62;}
.check{appearance:none;-webkit-appearance:none;width:1.45rem;height:1.45rem;border:1.5px solid var(--line3);border-radius:7px;background:var(--raised);cursor:pointer;position:relative;flex:0 0 auto;margin:0;transition:background var(--t-fast) ease,border-color var(--t) ease;}
.check:hover{border-color:#fff;}
.check:checked{background:#fff;border-color:#fff;}
.check:checked::after{content:"";position:absolute;left:.42rem;top:.15rem;width:.4rem;height:.75rem;border:solid #000;border-width:0 2px 2px 0;transform:rotate(45deg);}
.group-title{font-size:.68rem;letter-spacing:.15em;text-transform:uppercase;color:var(--dim);font-weight:600;padding:.75rem 1rem;background:#111;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:1rem;}
.empty{border:1px dashed var(--line3);border-radius:var(--r);padding:2rem 1.5rem;text-align:center;color:var(--muted);background:rgba(255,255,255,.015);}
.empty .eh{font-family:var(--disp);font-size:1.05rem;font-weight:700;color:var(--text);margin-bottom:.35rem;letter-spacing:-.02em;}
.empty p{margin:.2rem auto .9rem;max-width:30rem;font-size:1rem;color:#fff;}
.sum-row{display:flex;flex-wrap:wrap;gap:.6rem 1.6rem;padding:.8rem 1rem;border:1px solid var(--line);border-radius:var(--r);background:var(--card);margin-bottom:.8rem;}
.sum-row div{min-width:0;} .sum-row .v{font-family:var(--disp);font-size:1.2rem;font-weight:700;letter-spacing:-.02em;}

/* ---------- toolbars, filters, segments ---------- */
.toolbar{display:flex;flex-wrap:wrap;gap:.6rem;align-items:flex-end;margin-bottom:.9rem;}
.toolbar .field{min-width:9rem;flex:0 1 11rem;}
.toolbar .grow{flex:1;}
.seg{display:inline-flex;background:var(--raised);border:1px solid var(--line2);border-radius:var(--r-sm);padding:3px;gap:2px;flex-wrap:wrap;}
.seg button{background:transparent;border:0;color:var(--muted);padding:.4rem .85rem;min-height:2.1rem;border-radius:7px;cursor:pointer;font-weight:600;font-size:.82rem;transition:background var(--t) ease,color var(--t) ease,transform var(--t-fast) ease;}
.seg button:hover{color:#fff;}
.seg button:active{transform:scale(.95);}
.seg button[aria-pressed="true"]{background:#fff;color:#000;}

/* ---------- forms ---------- */
.field{display:flex;flex-direction:column;gap:.35rem;min-width:0;}
.field > label,.field > .flabel{font-size:.9rem;color:#fff;font-weight:600;}
.field .req{color:#fff;margin-left:.2rem;}
.hint{font-size:.86rem;color:var(--muted);line-height:1.45;}
.err{font-size:.9rem;color:#fff;display:flex;gap:.4rem;align-items:flex-start;font-weight:600;}
.err::before{content:"\25B2";font-size:.7rem;margin-top:.2rem;}
input[type=text],input[type=date],input[type=time],input[type=search],select,textarea{background:var(--raised);border:1px solid var(--line2);color:var(--text);padding:.6rem .75rem;min-height:2.6rem;border-radius:var(--r-sm);width:100%;transition:border-color var(--t) ease,box-shadow var(--t) ease,background var(--t) ease;}
textarea{min-height:5rem;resize:vertical;line-height:1.45;}
input::placeholder,textarea::placeholder{color:#B8B8B8;}
input:focus,select:focus,textarea:focus{outline:2px solid #fff;outline-offset:2px;border-color:#fff;background:var(--card2);box-shadow:0 0 0 3px rgba(255,255,255,.12);}
input[aria-invalid="true"],select[aria-invalid="true"],textarea[aria-invalid="true"]{border-color:#fff;border-width:2px;}
select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,#bbb 50%),linear-gradient(135deg,#bbb 50%,transparent 50%);background-position:calc(100% - 1.1rem) 55%,calc(100% - .8rem) 55%;background-size:.3rem .3rem,.3rem .3rem;background-repeat:no-repeat;padding-right:2rem;}
input[type=date]{color-scheme:dark;}
.money-wrap{position:relative;display:flex;align-items:center;}
.money-wrap input{padding-right:3.6rem;font-variant-numeric:tabular-nums;}
.money-wrap .cc{position:absolute;right:.75rem;font-size:.72rem;color:var(--dim);font-weight:600;pointer-events:none;letter-spacing:.04em;}
.fgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:.95rem;}
.fgrid .full{grid-column:1/-1;}
.cbox{display:flex;gap:.65rem;align-items:flex-start;font-size:.96rem;cursor:pointer;line-height:1.4;}
.cbox input{appearance:none;-webkit-appearance:none;width:1.3rem;height:1.3rem;border:1.5px solid var(--line3);border-radius:6px;background:var(--raised);flex:0 0 auto;margin:0;position:relative;cursor:pointer;}
.cbox input:checked{background:#fff;border-color:#fff;}
.cbox input:checked::after{content:"";position:absolute;left:.4rem;top:.12rem;width:.35rem;height:.7rem;border:solid #000;border-width:0 2px 2px 0;transform:rotate(45deg);}
.cbox small{display:block;color:var(--muted);font-size:.86rem;margin-top:.1rem;}
.inline-table{width:100%;border-collapse:collapse;}
.inline-table td{padding:.3rem .35rem .3rem 0;vertical-align:top;}
.inline-table th{text-align:left;font-size:.66rem;text-transform:uppercase;letter-spacing:.14em;color:var(--dim);padding:.3rem .35rem .5rem 0;font-weight:600;}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:1.2rem 1.35rem;}
.card + .card{margin-top:.9rem;}
.card h3{font-family:var(--disp);font-size:1rem;margin:0 0 .3rem;letter-spacing:-.02em;}
details.fold{border:1px solid var(--line);border-radius:var(--r);background:var(--card);margin-top:.9rem;}
details.fold > summary{cursor:pointer;padding:.85rem 1.1rem;font-weight:600;font-size:.88rem;list-style:none;display:flex;align-items:center;gap:.6rem;min-height:2.8rem;}
details.fold > summary::-webkit-details-marker{display:none;}
details.fold > summary::before{content:"+";display:inline-block;width:1.1rem;text-align:center;color:var(--dim);font-weight:700;}
details.fold[open] > summary::before{content:"\2212";}
details.fold > .fold-body{padding:0 1.1rem 1.1rem;color:#fff;font-size:.98rem;line-height:1.6;}
details.fold > .fold-body p{margin:.4rem 0;}

/* ---------- banners, toast, modal ---------- */
.banner{display:flex;gap:.8rem;align-items:flex-start;background:var(--raised);border:1px solid var(--line);border-left:3px solid var(--accent2);border-radius:var(--r);padding:.9rem 1.1rem;font-size:.86rem;line-height:1.5;margin-bottom:1rem;}
.banner.warn{border-left-color:#fff;background:#181818;}
.banner .ic{width:1.05rem;height:1.05rem;flex:0 0 auto;margin-top:.12rem;}
.banner .grow{flex:1;}
.savebar{position:sticky;top:0;z-index:70;background:#fff;color:#000;padding:.65rem 1rem;display:flex;gap:.8rem;align-items:center;flex-wrap:wrap;font-size:.86rem;font-weight:600;}
.savebar .btn{background:#000;color:#fff;border-color:#000;min-height:2.1rem;padding:.3rem .8rem;}
.toasts{position:fixed;left:50%;bottom:1.25rem;transform:translateX(-50%);z-index:400;display:flex;flex-direction:column;gap:.5rem;align-items:center;width:min(32rem,calc(100vw - 2rem));pointer-events:none;}
.toast{pointer-events:auto;background:#fff;color:#000;border-radius:var(--r-sm);padding:.7rem 1rem;font-weight:600;font-size:.86rem;display:flex;gap:.7rem;align-items:center;box-shadow:0 10px 40px rgba(0,0,0,.6);animation:tin 160ms cubic-bezier(.2,.8,.3,1);max-width:100%;}
.toast.err2{background:#111;color:#fff;border:2px solid #fff;}
.toast button{background:transparent;border:0;color:inherit;text-decoration:underline;font-weight:700;cursor:pointer;padding:.2rem;min-height:2rem;}
@keyframes tin{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.74);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:1rem;z-index:300;animation:fade 140ms ease;}
@keyframes fade{from{opacity:0;}to{opacity:1;}}
.modal{width:min(36rem,100%);max-height:calc(100vh - 2rem);max-height:calc(100dvh - 2rem);display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line3);border-radius:var(--r-lg);box-shadow:0 30px 90px rgba(0,0,0,.7);animation:min 170ms cubic-bezier(.2,.8,.3,1);}
.modal.wide{width:min(46rem,100%);}
@keyframes min{from{opacity:0;transform:translateY(12px) scale(.985);}to{opacity:1;transform:none;}}
.modal-h{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;padding:1.15rem 1.3rem .6rem;}
.modal-h h2{font-family:var(--disp);font-size:1.3rem;margin:0;letter-spacing:-.025em;line-height:1.15;}
.modal-b{padding:.4rem 1.3rem 1rem;overflow:auto;flex:1;}
.modal-f{display:flex;gap:.6rem;justify-content:flex-end;flex-wrap:wrap;padding:.9rem 1.3rem 1.15rem;border-top:1px solid var(--line);}
.modal-b p{margin:.3rem 0 .8rem;color:var(--muted);}

/* ---------- wizard ---------- */
.stepper{display:flex;gap:.35rem;margin:0 0 1.2rem;padding:0;list-style:none;}
.stepper li{flex:1;min-width:0;}
.stepper button{width:100%;background:transparent;border:0;padding:0;cursor:pointer;color:var(--dim);font-size:.66rem;text-align:left;font-weight:600;letter-spacing:.04em;}
.stepper .sb-bar{display:block;height:5px;border-radius:5px;background:var(--line2);margin-bottom:.45rem;transition:background var(--t) ease;}
.stepper .done .sb-bar{background:#777;}
.stepper .cur .sb-bar{background:#fff;}
.stepper .cur button{color:#fff;}
.stepper .sl{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.wiz-title{font-family:var(--disp);font-size:1.6rem;letter-spacing:-.03em;margin:.2rem 0 .4rem;line-height:1.1;}
.wiz-foot{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-top:1.4rem;padding-top:1.1rem;border-top:1px solid var(--line);}

/* ---------- tables and charts ---------- */
.tw{border:1px solid var(--line);border-radius:var(--r);overflow:auto;max-height:36rem;background:var(--card);}
table.t{width:100%;border-collapse:collapse;font-size:.92rem;min-width:46rem;}
table.t th{position:sticky;top:0;background:#131313;text-align:left;padding:.7rem .8rem;font-size:.64rem;text-transform:uppercase;letter-spacing:.13em;color:var(--dim);border-bottom:1px solid var(--line);white-space:nowrap;font-weight:600;z-index:1;}
table.t td{padding:.6rem .8rem;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap;}
table.t tr:last-child td{border-bottom:0;}
table.t tr.now td{background:rgba(255,255,255,.06);font-weight:600;}
table.t td.r,table.t th.r{text-align:right;}
.hbars{display:flex;flex-direction:column;gap:.75rem;margin-top:.9rem;}
.hbar .top{display:flex;justify-content:space-between;gap:1rem;font-size:.94rem;margin-bottom:.3rem;}
.hbar .track{height:9px;background:var(--line);border-radius:9px;overflow:hidden;}
.hbar .track i{display:block;height:100%;background:var(--accent);border-radius:9px;}
.mchart{display:flex;align-items:flex-end;gap:.7rem;height:11rem;margin-top:1rem;overflow-x:auto;padding-bottom:.2rem;}

/* ---- ids and timestamps ---- */
var _idn = 0;

   fils...). Floating point is used only to DISPLAY them. */
function digitsOf(cur) {
  if (DIGITS_0.indexOf(cur) >= 0) return 0;

/* =====================================================================
   3. DATA SCHEMA, VALIDATION, STORAGE, BACKUP
   ===================================================================== */

var S = null;                    // the whole customer data set
var RT = {                       // runtime-only state, never saved
  readOnly: false,               // true while we refuse to overwrite data we could not read
  recovery: null,                // {reason, raw}
  storageOK: true, saveError: "",
  loadReport: null, memoryOnly: false

function blankState() {

    app: APP.key, schema: APP.schema, createdAt: nowISO(), updatedAt: nowISO(),
    settings: {
      currency: "", locale: "auto", weekStart: 1, dateFmt: "locale", planStart: "",
      taxPct: 25, bufferMonths: 3, split: { buffer: 50, debt: 30, fun: 20 },
      opening: { a: 0, c: "", set: false },
      largeText: false, reduceMotion: false,
      spendCats: DEFAULT_SPEND_CATS.map(function (c) { return { id: uid(), name: c[0], type: c[1] }; }),
      incomeCats: DEFAULT_INCOME_CATS.slice(), allocCats: DEFAULT_ALLOC_CATS.slice()

    baseline: { override: { a: 0, c: "", set: false }, history: [], essentials: [] },
    income: [], bills: [], spending: [], goals: [bufferGoal("")], debts: [], tasks: [], plans: [],

/* ---- validation helpers ---- */

var RECUR_KEYS = RECUR.map(function (x) { return x[0]; });

  o.locale = (typeof s.locale === "string" && LOCALE_LIST.some(function (l) { return l[0] === s.locale; })) ? s.locale : "auto";

    catNames[n.toLowerCase()] = 1;

  });

/* ---- versioning ------------------------------------------------------

/* ---- load / save ---- */

/* =====================================================================
   4. CALCULATIONS
   Every number on screen comes from here. Each rule is stated once.

   * Only records in the planner's current currency are ever added together.
     Records in another currency stay visible but are never mixed in.
   * "Received" income counts as money in hand. "Expected" income never does.
   * Bills only become spending when YOU mark them paid (that creates one
     linked spending entry, so nothing is counted twice).
   * Savings contributions and debt payments leave your available balance
     (if you tick "from my available balance") but are NOT spending, so
     they never reduce your weekly flexible number.
   * Payday plans are plans. They never change a balance.
   ===================================================================== */

/* ---- the weekly engine ---------------------------------------------------
   Baseline = your lowest realistic month (or your own override).

  var known = baseline != null;

  var E = { cur: c, startN: startN, known: known, baseline: baseline, usingOverride: overrideOn, taxBp: taxBp, essentials: essentials };

  var now = Date.now();

  if (name !== "modal-close" && name !== "go" && name !== "set-f" && guardRepeat(name + "|" + (t.getAttribute("data-id") || "") + "|" + (t.getAttribute("data-v") || ""))) return;
  fn(t, e);

  if (!c) return;
  var fn = CHG[c.getAttribute("data-chg")];
  if (fn) { if (c.type === "checkbox" && guardRepeat("chg|" + c.getAttribute("data-chg") + "|" + (c.getAttribute("data-id") || ""))) { c.checked = !c.checked; return; } fn(c, e); }
});

  if (!MODALS.length) return;
  var top = MODALS[MODALS.length - 1];

  if (e.key === "Tab") {
    var f = focusables(top.back); if (!f.length) return;
    var first = f[0], last = f[f.length - 1];
    if (e.shiftKey && (document.activeElement === first || !top.back.contains(document.activeElement))) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});

/* =========================== INCOME =========================== */
function openIncomeForm(rec, preset) {
  if (!reqCurrency()) return;
  var isNew = !rec, v = rec || Object.assign({ source: "", amt: null, status: "received", date: todayISO(), expected: "", cat: "", notes: "", recur: "none" }, preset || {});
  var cc = rec ? rec.cur : S.settings.currency;
  openForm({
    title: isNew ? "Add income" : "Edit income", values: v, submitLabel: isNew ? "Add income" : "Save changes",
    intro: cc !== S.settings.currency ? "This entry is in " + cc + ", so it isn't counted in your " + S.settings.currency + " totals." : "",
    fields: [
      { key: "source", label: "Where is it from?", type: "text", req: true, full: true, max: 120, placeholder: "Client, employer, refund...", reqMsg: "Add a short name so you'll recognise it." },
      { key: "amt", label: "Amount", type: "money", req: true, positive: true, cur: cc, reqMsg: "How much is it?" },
      { key: "status", label: "Has it arrived?", type: "select", options: [["received", "Yes, it's in my account"], ["expected", "Not yet. It's expected"]], hint: "Only money that has arrived counts toward your balance." },
      { key: "date", label: "Date received", type: "date" },
      { key: "expected", label: "Expected date", type: "date", optional: true, hint: "Leave empty if you don't know." },
      { key: "cat", label: "Type of income", type: "select", options: [["", "No type"]].concat(catOptions(S.settings.incomeCats)), optional: true },
      { key: "recur", label: "How often does this repeat?", type: "select", options: RECUR_INCOME, hint: "Choosing a pattern adds the next expected payment when you mark this one received." },
      { key: "notes", label: "Notes", type: "textarea", full: true, optional: true, max: 1000 }
    ],
    validate: function (vals) {
      var e = {};
      if (vals.status === "received") {
        if (!vals.date) e.date = "When did it arrive?";
        else if (parseISO(vals.date) > todayN()) e.date = "That date is in the future. Choose “Not yet” if you're still waiting for it.";
      }
      return e;
    },
    onOpen: function (form) {
      var st = form.querySelector("#f_status");
      function sync() {
        var rcv = st.value === "received";
        form.querySelector('[data-fkey="date"]').hidden = !rcv;
        form.querySelector('[data-fkey="expected"]').hidden = rcv;
      }
      st.addEventListener("change", sync); sync();
    },
    onSubmit: function (x) {
      var d = x.status === "received" ? x.date : "", ex = x.status === "expected" ? x.expected : "";
      var base = d || ex, anchor = base ? ymd(parseISO(base)).d : 0;
      if (isNew) {
        S.income.push({ id: uid(), source: x.source, amt: x.amt, cur: S.settings.currency, status: x.status, date: d, expected: ex, cat: x.cat, notes: x.notes, recur: x.recur, anchor: anchor, seriesId: "", createdAt: nowISO(), updatedAt: nowISO() });
        var newest = S.income[S.income.length - 1];
        if (x.status === "received") spawnNextIncome(newest);
      } else {
        Object.assign(rec, { source: x.source, amt: x.amt, status: x.status, date: d, expected: ex, cat: x.cat, notes: x.notes, recur: x.recur, anchor: anchor });
        stamp(rec);
      }
      commit(isNew ? "Income added." : "Income updated.");
    }
  });
}
ACT["inc-add"] = function () { openIncomeForm(null); };
ACT["inc-add-expected"] = function () { openIncomeForm(null, { status: "expected", date: "" }); };
ACT["inc-edit"] = function (el) { var r = findById(S.income, el.getAttribute("data-id")); if (r) openIncomeForm(r); };

ACT["plan-row-add"] = function (el) {

ACT["plan-row-del"] = function (el) {

};
ACT["plan-fill"] = function (el) {

  var pa = parseMoney(form.querySelector("#f_amt").value, cur), alloc = 0;

};
function planCard(p) {

    <div style="display:flex;gap:1rem;justify-content:space-between;flex-wrap:wrap;align-items:flex-start">

    </div>

      <ul class="mini-list">${p.items.map(function (it) { return html`<li><span class="grow">${it.cat}</span><span class="amt">${fmtMoney(it.amt, p.cur)}</span></li>`; })}</ul>` : html`<p class="muted sm" style="margin:.8rem 0 0">No lines yet. Edit the plan to decide where this money goes.</p>`}
    <div class="btn-row" style="margin-top:.9rem"><button type="button" class="btn btn-sm" data-act="plan-edit" data-id="${p.id}" data-fk="pe:${p.id}">${ic("edit")} Edit</button><button type="button" class="btn btn-sm btn-ghost" data-act="plan-del" data-id="${p.id}">${ic("trash")} Remove</button></div>

PAGES.payday = {

      ${S.plans.length ? S.plans.map(planCard) : emptyState("No payday plans yet", "Plan a payment in under a minute: pick the money that arrived, then split it across bills, food, savings and whatever else matters.", "Plan a payday", "plan-add")}`;

/* =====================================================================
   7. PAGES: Weekly Reset (guided), week-by-week numbers, Tasks
   ===================================================================== */

function weekStartISO() { return toISO(snapToWeekStart(todayN(), S.settings.weekStart)); }
function lastReset() {
  return S.reset.history.slice().sort(function (a, b) { return b.doneAt.localeCompare(a.doneAt); })[0] || null;
}
function resetStatus() {
  var last = lastReset(), ws = weekStartISO(), a = S.reset.active;
  if (a) return { key: "progress", text: "In progress", detail: "Paused at step " + a.step + " of 9. Pick up whenever you like." };
  if (last && last.weekStart === ws) return { key: "done", text: "Done this week", detail: last.partial ? "A shorter reset counts too." : "Nicely done. Rest easy." };
  if (last) {
    var days = Math.max(0, todayN() - localDayOf(last.doneAt));
    return { key: "due", text: "Ready when you are", detail: "Your last reset was " + (days <= 1 ? "recently" : days + " days ago") + ". A quick one is fine." };
  }
  return { key: "new", text: "Not started yet", detail: "Your first one takes about ten minutes." };
}

/* ---- reset actions ---- */
function newActive() {
  return { weekStart: weekStartISO(), step: 1, startedAt: nowISO(), energy: "", fog: "", win: "", next: "", priority: "", notes: "" };
}
ACT["reset-start"] = function () {
  if (!reqCurrency()) return;
  if (!S.reset.active) { S.reset.active = newActive(); save(); }
  UI.f.reset = Object.assign(UI.f.reset || {}, { tab: "guided", open: true });
  render({ top: true });
};
ACT["reset-pause"] = function () {
  UI.f.reset.open = false; save(); render({ top: true });
  toast("Saved. Come back to your reset any time.");
};
ACT["reset-step"] = function (el) {
  var a = S.reset.active; if (!a) return;
  a.step = clamp(parseInt(el.getAttribute("data-v"), 10) || 1, 1, 9); save(); render({ top: true });
};
ACT["reset-next"] = function () { var a = S.reset.active; if (a && a.step < 9) { a.step++; save(); render({ top: true }); } };
ACT["reset-back"] = function () { var a = S.reset.active; if (a && a.step > 1) { a.step--; save(); render({ top: true }); } };
ACT["reset-discard"] = function () {
  confirmDialog({ title: "Throw away this reset?", message: "What you've entered in this reset (your notes, the priority and the energy check) will be cleared. Income, bills and spending you added stay where they are.", confirmLabel: "Throw it away", danger: true }).then(function (ok) {
    if (!ok) return;
    S.reset.active = null; UI.f.reset.open = false; commit("Reset cleared.");
  });
};
function finishReset(partial) {
  var a = S.reset.active; if (!a) return;
  var E = engine(), w = E.thisWeek, bal = balance();
  S.reset.history.push({
    id: uid(), weekStart: a.weekStart, doneAt: nowISO(), partial: !!partial,
    energy: a.energy, fog: a.fog, win: a.win, next: a.next, priority: a.priority, notes: a.notes,
    snap: { number: w && w.number != null ? w.number : null, safe: w && w.safe != null ? w.safe : null, balance: bal.known ? bal.value : null, cur: S.settings.currency }
  });
  S.reset.active = null; UI.f.reset.open = false; UI.f.reset.tab = "past";
  commit(partial ? "Saved as a shorter reset. That still counts." : "Reset saved. Well done. See you next week, or whenever suits you.");
}
ACT["reset-finish"] = function () { finishReset(false); };
ACT["reset-finish-early"] = function () { finishReset(true); };
ACT["reset-del"] = function (el) {
  var h = findById(S.reset.history, el.getAttribute("data-id")); if (!h) return;
  confirmDialog({ title: "Remove this reset from your history?", message: "Only the saved summary is removed.", confirmLabel: "Remove it", danger: true }).then(function (ok) {
    if (!ok) return; removeById(S.reset.history, h.id); commit("Removed.");
  });
};
INP["reset-field"] = function (el) {
  var a = S.reset.active; if (!a) return;
  var k = el.getAttribute("data-key"); a[k] = el.value.slice(0, k === "notes" ? 1000 : 200); save();
};
CHG["reset-field"] = INP["reset-field"];
ACT["set-opening"] = function () { openOpeningForm(); };
function openOpeningForm() {
  if (!reqCurrency()) return;
  var op = S.settings.opening;
  openForm({
    title: "Your starting balance", submitLabel: "Save", values: { a: op.c === S.settings.currency ? op.a : null },
    intro: "The money you had in hand when you started using this planner. Everything else is added or taken off from here. If your balance doesn't match your bank, this is the number to adjust.",
    fields: [{ key: "a", label: "Starting balance", type: "money", req: true, allowNeg: true, reqMsg: "Type 0 if you started from nothing." }],
    onSubmit: function (v) { S.settings.opening = { a: v.a, c: S.settings.currency, set: true }; commit("Starting balance saved."); }
  });
}

/* ---- the nine steps ---- */
function miniEmpty(text) { return html`<div class="empty" style="padding:1.2rem"><p style="margin:0">${text}</p></div>`; }
function stepBody(n) {
  var E = engine(), bal = balance(), t = todayN(), w = E.thisWeek, a = S.reset.active;
  switch (n) {
    case 1:
      return html`<p class="muted">Take a breath. First, just look at where you are. No fixing yet.</p>
        <div class="b" style="margin-bottom:.9rem"><h3>Available balance</h3>
          ${bal.known ? html`<div class="bv num" style="font-size:2.4rem">${fmtMoneyBig(bal.value)}</div>
            <dl class="kv" style="margin-top:.9rem"><dt>Starting balance</dt><dd>${fmtMoney(bal.opening)}</dd><dt>+ Income received</dt><dd>${fmtMoney(bal.income)}</dd><dt>− Spending</dt><dd>${fmtMoney(bal.spent)}</dd>${bal.saved ? html`<dt>− Moved to savings</dt><dd>${fmtMoney(bal.saved)}</dd>` : ""}${bal.debt ? html`<dt>− Paid toward debts</dt><dd>${fmtMoney(bal.debt)}</dd>` : ""}</dl>`
            : html`<div class="bv" style="font-size:1.3rem">Not enough information yet</div><div class="bd">Add your starting balance, then some income or spending.</div>`}
          <div class="btn-row" style="margin-top:.9rem"><button type="button" class="btn btn-sm" data-act="set-opening">${bal.openingSet ? "Doesn't match your bank? Adjust starting balance" : "Set your starting balance"}</button></div></div>
        ${w && w.number != null ? html`<div class="b"><h3>This week's flexible number</h3><div class="bv num">${fmtMoney(w.safe)} <span class="sm dim" style="font-family:var(--ui);font-weight:400">left of ${fmtMoney(w.number)}</span></div></div>` : ""}`;
    case 2: {
      var recent = S.income.filter(function (r) { return r.status === "received" && parseISO(r.date) != null && parseISO(r.date) >= t - 6 && parseISO(r.date) <= t; });
      var exp = S.income.filter(function (r) { var d = parseISO(r.expected); return r.status === "expected" && d != null && d <= t + 7; }).sort(function (x, y) { return x.expected.localeCompare(y.expected); });
      return html`<p class="muted">Did any money land this week? Mark expected payments as received, or add new ones.</p>
        ${exp.length ? html`<h2 class="st" style="margin-top:1rem">Waiting on</h2><div class="list">${exp.map(incomeRow)}</div>` : ""}
        <h2 class="st" style="margin-top:1.3rem">Received in the last 7 days</h2>
        ${recent.length ? html`<div class="list">${recent.map(incomeRow)}</div>` : miniEmpty("Nothing logged this week yet.")}
        <div class="btn-row" style="margin-top:.9rem"><button type="button" class="btn btn-primary" data-act="inc-add">${ic("plus")} Add income</button></div>`;
    }
    case 3: {
      var due = S.bills.filter(function (b) { var d = parseISO(b.due); return !b.paid && d != null && d <= t + 7; }).sort(function (x, y) { return x.due.localeCompare(y.due); });
      var tot = sumBy(due.filter(inCur), function (b) { return b.amt; });
      return html`<p class="muted">These are due before your next reset. Pay what you can, and don't worry about the rest yet.</p>
        ${due.length ? html`<div class="sum-row"><div><div class="lbl">Due or overdue</div><div class="v num">${fmtMoney(tot)}</div></div><div><div class="lbl">Bills</div><div class="v num">${due.length}</div></div></div><div class="list">${due.map(billRow)}</div>` : miniEmpty("No unpaid bills are due in the next 7 days.")}
        <div class="btn-row" style="margin-top:.9rem"><button type="button" class="btn" data-act="bill-add">${ic("plus")} Add a bill</button></div>`;
    }
    case 4: {
      var sp = S.spending.filter(function (r) { var d = parseISO(r.date); return d != null && d >= t - 6 && d <= t; }).sort(function (x, y) { return y.date.localeCompare(x.date); });
      var st = sumBy(sp.filter(inCur), function (r) { return r.amt; });
      var fx = sumBy(sp.filter(function (r) { return inCur(r) && entryType(r) === "Flexible"; }), function (r) { return r.amt; });
      return html`<p class="muted">A quick look back. Rough is fine. Add anything you remember that isn't logged.</p>
        ${sp.length ? html`<div class="sum-row"><div><div class="lbl">Last 7 days</div><div class="v num">${fmtMoney(st)}</div></div><div><div class="lbl">Flexible</div><div class="v num">${fmtMoney(fx)}</div></div></div><div class="list">${sp.slice(0, 12).map(spendRow)}</div>${sp.length > 12 ? html`<p class="sm dim">Showing the latest 12 of ${sp.length}.</p>` : ""}` : miniEmpty("No spending logged in the last 7 days.")}
        <div class="btn-row" style="margin-top:.9rem"><button type="button" class="btn btn-primary" data-act="sp-add">${ic("plus")} Add spending</button></div>`;
    }
    case 5:
      if (!E.known) return html`<p class="muted">This step needs your baseline, which is your slowest realistic month. It's what makes a weekly number possible.</p><div class="banner">${ic("info")}<div class="grow"><strong>Not enough information yet.</strong> Add your last few months of income on the Baseline page.<div class="btn-row" style="margin-top:.6rem"><button type="button" class="btn btn-sm" data-act="go" data-page="baseline">Open Baseline</button></div></div></div>`;
      return html`<p class="muted">Here's the number for this week, worked out from your baseline. Decide what the rest of the money is for.</p>
        <div class="b"><h3>Flexible money left this week</h3><div class="bv num" style="font-size:2.3rem">${w ? fmtMoneyBig(w.safe) : "-"}</div>
          ${w ? html`<dl class="kv" style="margin-top:.9rem"><dt>Weekly allowance</dt><dd>${fmtMoney(E.allowance)}</dd><dt>+ Carried over</dt><dd>${fmtMoney(w.carry)}</dd><dt>− Flexible spending</dt><dd>${fmtMoney(w.flex)}</dd><div class="sep"></div><dt><strong>Left to spend</strong></dt><dd class="tot">${fmtMoney(w.safe)}</dd></dl>` : html`<div class="bd">Your planner year starts ${fmtDate(E.startN)}.</div>`}</div>
        ${w ? html`<div class="card" style="margin-top:.9rem"><h3>Money to move aside</h3><p class="muted sm" style="margin:.2rem 0 .6rem">${w.tax > 0 ? "From this week's income, set aside " : "Nothing to set aside from this week's income."}${w.tax > 0 ? html`<strong>${fmtMoney(w.tax)}</strong>` : ""}${w.tax > 0 ? " for tax (" + fmtPct(S.settings.taxPct) + ")." : ""}${w.bonus > 0 ? html` You earned <strong>${fmtMoney(w.bonus)}</strong> above your baseline: a suggested split is ${fmtMoney(Math.round(w.bonus * S.settings.split.buffer / 100))} to your buffer, ${fmtMoney(Math.round(w.bonus * S.settings.split.debt / 100))} to debt or savings, and ${fmtMoney(Math.round(w.bonus * S.settings.split.fun / 100))} for fun.` : ""}</p><p class="hint">These are suggestions. Move the real money yourself, then record it in Savings or Debt.</p></div>` : ""}
        <div class="btn-row" style="margin-top:.9rem"><button type="button" class="btn" data-act="plan-add">${ic("plan")} Plan how a payment will be used</button></div>`;
    case 6: {
      var gl = S.goals.filter(function (g) { return goalTarget(g) > goalSaved(g) || goalTarget(g) === 0; }), db = S.debts.filter(function (d) { return debtBalance(d) > 0; });
      var opts = [["", "No priority this week"]].concat(gl.map(function (g) { return ["Savings: " + g.name, "Savings: " + g.name]; })).concat(db.map(function (d) { return ["Debt: " + d.name, "Debt: " + d.name]; }));

        ${gl.length ? html`<h2 class="st" style="margin-top:1rem">Savings</h2><div class="list">${gl.map(function (g) { var tg = goalTarget(g), sv = goalSaved(g); return html`<div class="rec"><div class="main"><div class="ttl">${g.name}</div><div class="bar" style="margin-top:.5rem"><i style="width:${pctOf(sv, tg)}%"></i></div></div><div class="amt">${fmtMoney(sv, g.cur)}<small>${tg > 0 ? "of " + fmtMoney(tg, g.cur) : "no target set"}</small></div></div>`; })}</div>` : ""}
        ${db.length ? html`<h2 class="st" style="margin-top:1.3rem">Debts</h2><div class="list">${db.map(function (d) { return html`<div class="rec"><div class="main"><div class="ttl">${d.name}</div><div class="meta">${d.minPay ? html`<span>Minimum ${fmtMoney(d.minPay, d.cur)}</span>` : ""}${d.due ? html`<span>Due ${fmtDateISO(d.due)}</span>` : ""}</div></div><div class="amt">${fmtMoney(debtBalance(d), d.cur)}<small>left to pay</small></div></div>`; })}</div>` : ""}
        ${!gl.length && !db.length ? miniEmpty("No savings goals or debts yet. That's fine. You can add them later.") : ""}
        <div class="field" style="margin-top:1.2rem;max-width:26rem"><label for="rs_priority">This week's priority</label><select id="rs_priority" data-chg="reset-field" data-key="priority">${optionTags(opts, a.priority)}</select></div>`;
    }
    case 7: {
      var ws = a.weekStart, open = S.tasks.filter(function (k) { return k.status !== "done"; }).sort(function (x, y) { return (x.due || "9999").localeCompare(y.due || "9999"); });
      var cand = open.filter(function (k) { var d = parseISO(k.due); return d == null || d <= t + 7; });
      var picked = open.filter(function (k) { return k.focusWeek === ws; }).length;
      return html`<p class="muted">Pick up to three things that would make this week feel good. Small counts.</p>
        <p class="sm" style="margin:.2rem 0 .8rem"><span class="tag ${picked > 3 ? "t-warn" : ""}">${picked} chosen</span> ${picked > 3 ? "That's quite a few. Is every one realistic?" : ""}</p>
        ${cand.length ? html`<div class="list">${cand.map(function (k) { return taskRow(k, true); })}</div>` : miniEmpty("No open tasks for this week. Add one below.")}
        <div class="btn-row" style="margin-top:.9rem"><button type="button" class="btn btn-primary" data-act="task-add">${ic("plus")} Add a task</button></div>`;
    }
    case 8:
      return html`<p class="muted">Name one thing for next week. Just one. Then a quick check-in on how you're doing.</p>
        <div class="fgrid">
          <div class="field full"><label for="rs_next">The one important next action</label><input type="text" id="rs_next" maxlength="200" value="${a.next}" data-inp="reset-field" data-chg="reset-field" data-key="next" placeholder="e.g. Send the two overdue invoices" autocomplete="off"></div>
          <div class="field full"><label for="rs_win">One win from this week <span class="dim" style="font-weight:400">(optional)</span></label><input type="text" id="rs_win" maxlength="200" value="${a.win}" data-inp="reset-field" data-chg="reset-field" data-key="win" placeholder="Anything counts" autocomplete="off"></div>
          <div class="field"><label for="rs_energy">Energy this week</label><select id="rs_energy" data-chg="reset-field" data-key="energy">${optionTags([["", "Skip"], ["Low", "Low"], ["Medium", "Medium"], ["High", "High"]], a.energy)}</select></div>
          <div class="field"><label for="rs_fog">Brain fog</label><select id="rs_fog" data-chg="reset-field" data-key="fog">${optionTags([["", "Skip"], ["Low", "Low"], ["Medium", "Medium"], ["High", "High"]], a.fog)}</select></div>
          <div class="field full"><label for="rs_notes">Anything else? <span class="dim" style="font-weight:400">(optional)</span></label><textarea id="rs_notes" data-inp="reset-field" data-chg="reset-field" data-key="notes" maxlength="1000">${a.notes}</textarea></div>
        </div>`;
    default: {
      var sn = w && w.number != null;

        <div class="card"><dl class="kv"><dt>Week of</dt><dd>${fmtDateISO(a.weekStart)}</dd>
          <dt>Available balance</dt><dd>${bal.known ? fmtMoney(bal.value) : "Not enough information yet"}</dd>
          <dt>Flexible money left</dt><dd>${sn ? fmtMoney(w.safe) : "Not enough information yet"}</dd>
          <dt>Priority</dt><dd>${a.priority || "None this week"}</dd>

          ${a.energy || a.fog ? html`<dt>Energy / fog</dt><dd>${a.energy || "-"} / ${a.fog || "-"}</dd>` : ""}
          <dt>Focus tasks</dt><dd>${S.tasks.filter(function (k) { return k.status !== "done" && k.focusWeek === a.weekStart; }).length}</dd></dl></div>`;
    }
  }
}
function wizardHTML() {

function previousResetCard() {

function openTaskForm(rec, preset) {
  var isNew = !rec, v = rec || Object.assign({ title: "", kind: "task", due: "", time: "", prio: "2", cat: "", recur: "none", notes: "" }, preset || {});
  openForm({
    title: isNew ? "Add a task" : "Edit task", values: v, submitLabel: isNew ? "Add task" : "Save changes",
    fields: [
      { key: "title", label: "What needs doing?", type: "text", req: true, full: true, max: 160, placeholder: "Call the dentist", reqMsg: "Give it a short name." },
      { key: "kind", label: "Type", type: "select", options: [["task", "Task"], ["appointment", "Appointment"]] },
      { key: "due", label: "Date", type: "date", optional: true },
      { key: "time", label: "Time", type: "time", optional: true },
      { key: "prio", label: "Importance", type: "select", options: [["1", "High"], ["2", "Normal"], ["3", "Low"]] },
      { key: "cat", label: "Category", type: "select", options: [["", "No category"]].concat(catOptions(TASK_CATS)), optional: true },
      { key: "recur", label: "Repeat", type: "select", options: RECUR_TASK, full: true, hint: "When you tick it off, the next one is added once." },
      { key: "notes", label: "Notes", type: "textarea", full: true, optional: true, max: 1000 }
    ],
    validate: function (x) {
      var e = {};
      if (x.kind === "appointment" && !x.due) e.due = "When is the appointment?";
      if (x.recur !== "none" && !x.due) e.due = "Repeating tasks need a date to repeat from.";
      return e;
    },
    onSubmit: function (x) {
      var anchor = x.due ? ymd(parseISO(x.due)).d : 0;
      if (isNew) S.tasks.push({ id: uid(), title: x.title, due: x.due, time: x.time, prio: x.prio, cat: x.cat, kind: x.kind, status: "todo", doneAt: "", recur: x.recur, anchor: anchor, seriesId: "", notes: x.notes, focusWeek: "", createdAt: nowISO(), updatedAt: nowISO() });
      else { Object.assign(rec, { title: x.title, due: x.due, time: x.time, prio: x.prio, cat: x.cat, kind: x.kind, recur: x.recur, anchor: anchor, notes: x.notes }); stamp(rec); }
      commit(isNew ? "Task added." : "Task updated.");
    }
  });
}
ACT["task-add"] = function () { openTaskForm(null); };
ACT["task-edit"] = function (el) { var k = findById(S.tasks, el.getAttribute("data-id")); if (k) openTaskForm(k); };
ACT["task-del"] = function (el) {
  var k = findById(S.tasks, el.getAttribute("data-id")); if (!k) return;
  confirmDialog({ title: "Remove this task?", message: "“" + k.title + "” will be removed.", confirmLabel: "Remove it", danger: true }).then(function (ok) {
    if (!ok) return; removeById(S.tasks, k.id); commit("Task removed.");
  });
};
ACT["task-focus"] = function (el) {
  var k = findById(S.tasks, el.getAttribute("data-id")); if (!k) return;
  var ws = S.reset.active ? S.reset.active.weekStart : weekStartISO();
  k.focusWeek = k.focusWeek === ws ? "" : ws; stamp(k);
  commit();
};
CHG["task-toggle"] = function (el) {
  var k = findById(S.tasks, el.getAttribute("data-id")); if (!k) return;
  if (el.checked) {
    k.status = "done"; k.doneAt = todayISO(); stamp(k);
    var nx = spawnNextTask(k);

  } else { k.status = "todo"; k.doneAt = ""; stamp(k); commit(); }

SUB["quick-task"] = function (form) {
  var inp = form.querySelector("input"), v = inp.value.trim();
  if (!v) { inp.focus(); return; }
  S.tasks.push({ id: uid(), title: v.slice(0, 160), due: todayISO(), time: "", prio: "2", cat: "", kind: "task", status: "todo", doneAt: "", recur: "none", anchor: ymd(todayN()).d, seriesId: "", notes: "", focusWeek: "", createdAt: nowISO(), updatedAt: nowISO() });
  commit("Added for today.");
  var again = $("#quickTask"); if (again) again.focus();
};
function taskRow(k, showFocus) {
  var d = parseISO(k.due), t = todayN(), late = d != null && d < t && k.status !== "done", done = k.status === "done", focus = k.focusWeek && k.focusWeek === (S.reset.active ? S.reset.active.weekStart : weekStartISO());

    <input type="checkbox" class="check" data-chg="task-toggle" data-id="${k.id}" data-fk="tk:${k.id}" ${raw(done ? "checked" : "")} aria-label="${done ? "Mark not done: " : "Mark done: "}${k.title}">
    <div class="main"><div class="ttl">${k.title}</div><div class="meta">${k.kind === "appointment" ? html`<span class="tag">${ic("appt")} Appointment</span>` : ""}<span>${dtxt}${k.time ? " at " + k.time : ""}</span>${late ? html`<span class="tag t-soon">Slipped. That's okay</span>` : ""}${k.prio === "1" ? html`<span class="tag">High</span>` : ""}${k.cat ? html`<span>${k.cat}</span>` : ""}${k.recur !== "none" ? html`<span>${recurLabel(RECUR_TASK, k.recur)}</span>` : ""}${focus ? html`<span class="tag t-warn">Focus this week</span>` : ""}</div></div>
    <div class="acts">${!done && showFocus !== false ? html`<button type="button" class="btn btn-sm ${focus ? "" : "btn-ghost"}" data-act="task-focus" data-id="${k.id}" data-fk="tf:${k.id}" aria-pressed="${String(!!focus)}">${focus ? "Focused" : "Focus"}</button>` : ""}
      <button type="button" class="icon-btn" data-act="task-edit" data-id="${k.id}" data-fk="te:${k.id}" aria-label="Edit ${k.title}">${ic("edit")}</button>
      <button type="button" class="icon-btn" data-act="task-del" data-id="${k.id}" aria-label="Remove ${k.title}">${ic("trash")}</button></div>
  </div>`;
}
function tasksRegion() {

  var open = S.tasks.filter(function (k) { return k.status !== "done"; });

    var slipped = open.filter(function (k) { var d = parseISO(k.due); return d != null && d < t; }).sort(byDue);
    var focus = open.filter(function (k) { return k.focusWeek === ws && k.due !== toISO(t) && !(parseISO(k.due) < t); }).sort(byDue);

    out.push(today.length || focus.length ? html`<div class="list">${today.length ? html`<div class="group-title"><span>Today</span><span>${today.length}</span></div>${today.map(taskRow)}` : ""}${focus.length ? html`<div class="group-title"><span>Your focus this week</span><span>${focus.length}</span></div>${focus.map(taskRow)}` : ""}</div>` : html`<div class="empty"><div class="eh">Nothing planned for today</div><p>${slipped.length ? "A few older things are waiting below, if you want one." : "Enjoy the space, or add one small thing above."}</p></div>`);

    if (doneToday.length) out.push(html`<details class="fold"><summary>Done today (${doneToday.length})</summary><div class="fold-body"><div class="list">${doneToday.map(taskRow)}</div></div></details>`);

  }
  if (tab === "upcoming") {
    var up = open.filter(function (k) { var d = parseISO(k.due); return d != null && d > t && d <= t + 30; }).sort(byDue);
    if (!up.length) return html`<div class="empty"><div class="eh">Nothing coming up in the next 30 days</div><p>Add a task or appointment when you're ready.</p><button type="button" class="btn btn-primary" data-act="task-add">${ic("plus")} Add a task</button></div>`;

    return html`<div class="list">${Object.keys(days).sort().map(function (d) { return html`<div class="group-title"><span>${fmtDayShort(parseISO(d))}</span><span>${relDay(parseISO(d))}</span></div>${days[d].map(taskRow)}`; })}</div>`;

  openForm({
    title: isNew ? "Add a debt" : "Edit debt", values: v, submitLabel: isNew ? "Add debt" : "Save changes",
    fields: [
      { key: "name", label: "What is it?", type: "text", req: true, full: true, max: 80, placeholder: "Credit card, overdraft, loan...", reqMsg: "Give it a name." },
      { key: "start", label: "Balance when you started tracking", type: "money", req: true, cur: cc, reqMsg: "How much did you owe?", hint: "Payments you record below take this down." },
      { key: "minPay", label: "Minimum payment (monthly)", type: "money", cur: cc, optional: true },
      { key: "due", label: "Next payment due", type: "date", optional: true },
      { key: "rate", label: "Interest rate (yearly %)", type: "pct", min: 0, max: 1000, optional: true, hint: "Only used for the rough estimate." },
      { key: "notes", label: "Notes", type: "textarea", full: true, optional: true, max: 1000 }

  });
}

ACT["export"] = function () { exportBackup(); render(); toast("Backup downloaded. Keep the file somewhere safe."); };

CHG["import-file"] = function (el) {
  var file = el.files && el.files[0]; if (!file) return;
  if (file.size > 20 * 1024 * 1024) { infoDialog("That file is too big", html`<p>Planner backups are small. This file is over 20 MB, so it's probably not one.</p>`); return; }
  function got(text) { handleImportText(text, file.name); }
  if (file.text) file.text().then(got, function () { toast("Couldn't read that file.", { err: true }); });
  else { var fr = new FileReader(); fr.onload = function () { got(String(fr.result)); }; fr.onerror = function () { toast("Couldn't read that file.", { err: true }); }; fr.readAsText(file); }
};
function handleImportText(text, name) {
  var res = readBackup(text);
  if (!res.ok) { infoDialog("I couldn't use that file", html`<p>${res.error}</p><p>Your planner data hasn't been touched.</p>`); return; }
  var c = countRecords(res.state);
  var pieces = [["income entry", "income entries", c.income], ["bill", "bills", c.bills], ["spending entry", "spending entries", c.spending], ["savings goal", "savings goals", c.goals], ["debt", "debts", c.debts], ["task", "tasks", c.tasks], ["saved reset", "saved resets", c.resets]].filter(function (p) { return p[2] > 0; }).map(function (p) { return plural(p[2], p[0], p[1]); });
  confirmDialog({
    title: "Replace what's here with this backup?",
    message: "“" + name + "” contains " + (pieces.length ? pieces.join(", ") : "no records yet") + " in " + res.state.settings.currency + ". Restoring replaces everything currently in the planner. A copy of what's here now is kept in this browser first, in case you change your mind.",
    extra: res.droppedTotal ? html`<div class="banner warn">${ic("alert")}<div class="grow">${plural(res.droppedTotal, "record")} in the file looked damaged and will be left out.</div></div>` : "",

    if (!ok) return;
    try { if (RT.recovery) window.localStorage.setItem(APP.badKey, RT.recovery.raw); } catch (e) { /* best effort */ }
    S = sanitize(blankState()).state; RT.readOnly = false; RT.recovery = null; RT.engine = null; save(); applyPrefs();
    closeAllModals(); show("home", true); setTimeout(openOnboarding, 60);
  });
};

/* =====================================================================
   PREVIEW BUILD ONLY. Not part of the planner customers buy.
   Sample data, nothing saved, every add / edit / delete / backup switched off.
   ===================================================================== */
var PREVIEW = true;
var PREVIEW_SEED = function () {
  var t = todayN();
  function iso(n) { return toISO(n); }
  S.settings.currency = "GBP"; S.settings.opening = { a: 85000, c: "GBP", set: true };
  S.meta.onboarded = true;
  S.meta.lastExport = nowISO();   /* so Home does not nag preview visitors to save a backup they cannot make */
  S.baseline.history = [["Jan", 320000], ["Feb", 150000], ["Mar", 280000], ["Apr", 410000], ["May", 220000], ["Jun", 180000]].map(function (x) { return { id: uid(), label: x[0], amt: x[1], cur: "GBP" }; });
  S.baseline.essentials = [["Rent", 90000], ["Bills", 25000], ["Groceries", 30000], ["Phone", 3500]].map(function (x) { return { id: uid(), name: x[0], amt: x[1], cur: "GBP" }; });
  [[-2, "Logo job", 120000, "received", "Client work"], [-9, "Workshop fee", 60000, "received", "Client work"], [-16, "Brand refresh", 200000, "received", "Client work"]].forEach(function (x) {
    S.income.push({ id: uid(), source: x[1], amt: x[2], cur: "GBP", status: x[3], date: iso(t + x[0]), expected: "", cat: x[4], notes: "", recur: "none", anchor: 0, seriesId: "", createdAt: nowISO(), updatedAt: nowISO() });
  });
  S.income.push({ id: uid(), source: "Packaging design", amt: 90000, cur: "GBP", status: "expected", date: "", expected: iso(t + 6), cat: "Client work", notes: "", recur: "none", anchor: 0, seriesId: "", createdAt: nowISO(), updatedAt: nowISO() });
  [["Rent", 90000, -3], ["Phone", 3500, 2], ["Insurance", 4200, 12], ["Software", 1999, 25]].forEach(function (x) {
    S.bills.push({ id: uid(), name: x[0], amt: x[1], cur: "GBP", due: iso(t + x[2]), cat: "Rent / mortgage", paid: false, paidDate: "", recur: x[0] === "Phone" ? "monthly" : "none", anchor: ymd(t + x[2]).d, seriesId: "", prio: "2", notes: "", expId: "", createdAt: nowISO(), updatedAt: nowISO() });
  });
  [[0, "Takeaway", 1850, "Eating out"], [-1, "Groceries", 5420, "Groceries"], [-2, "Coffee", 360, "Eating out"], [-4, "Train", 2300, "Transport"], [-5, "Cinema", 1200, "Fun"]].forEach(function (x) {
    var c = spendCat(x[3]);
    S.spending.push({ id: uid(), date: iso(t + x[0]), what: x[1], amt: x[2], cur: "GBP", cat: x[3], ctype: c ? c.type : "Flexible", method: "Card", notes: "", billId: "", createdAt: nowISO(), updatedAt: nowISO() });
  });
  S.goals.push({ id: uid(), kind: "goal", name: "New laptop", target: 120000, start: 20000, cur: "GBP", date: iso(t + 120), notes: "", contribs: [{ id: uid(), date: iso(t - 10), amt: 15000, fromBal: true, note: "" }], createdAt: nowISO(), updatedAt: nowISO() });
  S.debts.push({ id: uid(), name: "Credit card", start: 180000, cur: "GBP", minPay: 5500, due: iso(t + 9), rate: 21.9, notes: "", entries: [{ id: uid(), date: iso(t - 12), amt: 20000, kind: "payment", fromBal: true, note: "" }], createdAt: nowISO(), updatedAt: nowISO() });
  [["Send two invoices", 0, "1", "task"], ["Dentist", 3, "2", "appointment"], ["Sort receipts", -2, "2", "task"], ["Book train", 5, "3", "task"]].forEach(function (x) {
    S.tasks.push({ id: uid(), title: x[0], due: iso(t + x[1]), time: x[3] === "appointment" ? "14:30" : "", prio: x[2], cat: "Personal", kind: x[3], status: "todo", doneAt: "", recur: "none", anchor: 0, seriesId: "", notes: "", focusWeek: "", createdAt: nowISO(), updatedAt: nowISO() });
  });
  S.plans.push({ id: uid(), label: "Logo job payment", incomeId: "", amt: 120000, cur: "GBP", date: iso(t - 2), items: [{ id: uid(), cat: "Essential bills", amt: 60000 }, { id: uid(), cat: "Savings", amt: 20000 }, { id: uid(), cat: "Flexible spending", amt: 25000 }], notes: "", createdAt: nowISO(), updatedAt: nowISO() });
};
/* never read or write the browser's storage */
loadState = function () { S = sanitize(blankState()).state; PREVIEW_SEED(); return S; };
save = function () { RT.engine = null; RT.storageOK = true; RT.saveError = ""; RT.memoryOnly = false; return true; };
snapshotForUndo = function () { return false; };

/* switch off everything that adds, edits, deletes, saves or backs up */
var PREVIEW_OK_ACT = { "go": 1, "modal-close": 1, "confirm-yes": 1, "set-f": 1, "more": 1 };
var PREVIEW_OK_CHG = { "filter": 1, "set-flag": 1 };
var PREVIEW_OK_INP = { "filter": 1 };
function previewLocked() {
  toast("Preview only. Adding, editing and saving are switched off here. The full planner comes as a file when you buy it.", { ms: 5200 });
}
Object.keys(ACT).forEach(function (k) { if (!PREVIEW_OK_ACT[k]) ACT[k] = function () { previewLocked(); }; });
Object.keys(CHG).forEach(function (k) { if (!PREVIEW_OK_CHG[k]) CHG[k] = function (el) { previewLocked(); try { render(); } catch (e) { /* ignore */ } }; });
Object.keys(INP).forEach(function (k) { if (!PREVIEW_OK_INP[k]) INP[k] = function () { }; });
Object.keys(SUB).forEach(function (k) { SUB[k] = function () { previewLocked(); }; });

/* banner + watermark */
(function () {
  /* keep the PREVIEW: prefix on every page (the planner resets the title each time you change page) */
  function tagTitle() { if (document.title.indexOf("PREVIEW: ") !== 0) document.title = "PREVIEW: " + document.title; }
  tagTitle();
  try { new MutationObserver(tagTitle).observe(document.querySelector("title"), { childList: true, characterData: true, subtree: true }); } catch (e) { /* ignore */ }
  var st = document.createElement("style");
  st.textContent = "body{padding-bottom:2.6rem}" +
    "@media (min-width:641px){.toasts{bottom:4rem}}" +
    "#pvBar{position:fixed;left:0;right:0;bottom:0;z-index:99999;background:#f2f2f2;color:#070707;font:600 .8rem/1.3 system-ui,sans-serif;text-align:center;padding:.55rem 1rem calc(.55rem + env(safe-area-inset-bottom));letter-spacing:.02em}" +
    "#pvMark{position:fixed;inset:0;z-index:99998;pointer-events:none;overflow:hidden;display:flex;align-items:center;justify-content:center}" +
    "#pvMark span{font:800 clamp(4rem,14vw,11rem)/1 system-ui,sans-serif;color:#fff;opacity:.05;transform:rotate(-24deg);white-space:nowrap;letter-spacing:.1em}";
  document.head.appendChild(st);
  var b = document.createElement("div"); b.id = "pvBar";
  b.textContent = "PREVIEW ONLY: sample data, nothing is saved. This is not the planner. You get the full file when you buy.";
  var m = document.createElement("div"); m.id = "pvMark"; m.setAttribute("aria-hidden", "true"); m.innerHTML = "<span>PREVIEW</span>";
  document.body.appendChild(m); document.body.appendChild(b);
})();

/* =====================================================================
   11. START-UP
   ===================================================================== */
function boot() {
  S = loadState();
  applyPrefs();
  buildNav();
  var n = (location.hash || "").replace(/^#\/?/, "") || "home";
  UI.page = PAGES[n] ? n : "home";
  show(UI.page, true);
  if (RT.recovery) openRecovery();
  else if (!S.meta.onboarded || !S.settings.currency) openOnboarding();
}
/* If the planner is open in a second tab, take the newest data instead of overwriting it. */
window.addEventListener("storage", function (e) {
  if (e.key !== APP.key || RT.readOnly) return;
  var fresh = loadState();
  if (RT.recovery) { openRecovery(); return; }
  S = fresh; RT.engine = null; _dfCache = {};
  closeAllModals(); applyPrefs(); render();
  toast("This planner was changed in another window, so I've loaded the latest. If you were in the middle of something, please do it again.", { ms: 8000 });
  if (!S.meta.onboarded || !S.settings.currency) openOnboarding();
});
boot();

</script>
