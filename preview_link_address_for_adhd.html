:root{
  --bg:#070707; --raised:#121212; --card:#151515; --card2:#1C1C1C;
  --line:#262626; --line2:#333333; --line3:#4A4A4A;
  --text:#FFFFFF; --muted:#EDEDED; --dim:#D6D6D6; --faint:#5C5C5C;
  --ui:"AIO Text",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --disp:"AIO Display","AIO Text",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--ui);font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
  background-image:radial-gradient(900px 520px at 10% -8%,#1b1b1b 0%,var(--bg) 62%)}
.top{display:flex;align-items:center;gap:14px;padding:calc(1.4rem + env(safe-area-inset-top,0px)) 1.6rem 0}
.top img{height:50px;width:auto;display:block}
.brand{font-weight:600;font-size:.82rem;letter-spacing:.2em;text-transform:uppercase;color:var(--text);white-space:nowrap}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:2rem 1.25rem 3rem}
.card{width:min(34rem,100%);background:var(--card);border:1px solid var(--line);border-radius:20px;padding:2.4rem 2rem 2rem;text-align:center;
  box-shadow:0 30px 70px rgba(0,0,0,.55)}
.eyebrow{display:inline-flex;align-items:center;gap:.55rem;font-weight:600;font-size:.85rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.eyebrow:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--text)}
h1{font-family:var(--disp);font-weight:700;font-size:2.1rem;line-height:1.05;letter-spacing:-.03em;margin-top:.9rem}
.sub{color:#fff;margin-top:.8rem;line-height:1.55;font-size:1.05rem}
.go{display:flex;align-items:center;justify-content:center;min-height:3.1rem;margin-top:1.8rem;background:#fff;color:#000;text-decoration:none;
  font-weight:600;font-size:1rem;border-radius:12px;padding:.7rem 1.2rem;border:1px solid #fff;
  transition:transform 90ms,background 160ms}
.go:hover{background:#E8E8E8}
.go:active{transform:scale(.975)}
.go:focus-visible,.copy:focus-visible,.more a:focus-visible{outline:2px solid #fff;outline-offset:3px}
.addr{margin-top:1.1rem;display:flex;align-items:center;gap:.5rem;background:var(--raised);border:1px solid var(--line2);border-radius:10px;padding:.35rem .35rem .35rem .85rem}
.addr span{flex:1;min-width:0;text-align:left;color:#fff;font-size:1rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.copy{flex:none;min-height:2.3rem;padding:0 .95rem;background:var(--card2);color:#fff;border:1px solid var(--line2);border-radius:8px;
  font:600 .8rem var(--ui);cursor:pointer;transition:transform 90ms,border-color 160ms}
.copy:hover{border-color:var(--line3)}
.copy:active{transform:scale(.965)}
.more{margin-top:1.4rem;display:grid;gap:.6rem}
.more:empty{display:none}
.more a{display:block;color:var(--text);text-decoration:none;font-weight:600;font-size:.9rem;padding:.7rem 1rem;border:1px solid var(--line2);border-radius:10px;background:var(--raised)}
.more a:hover{border-color:var(--line3);background:var(--card2)}
.note{margin-top:1.4rem;color:var(--muted);font-size:1rem}
footer{padding:0 1.6rem calc(1.4rem + env(safe-area-inset-bottom,0px));color:var(--dim);font-size:.85rem;letter-spacing:.12em;text-transform:uppercase;text-align:center}
@media (max-width:480px){.top{padding-left:1.1rem}.card{padding:2rem 1.25rem 1.5rem}h1{font-size:1.8rem}}
@media (pointer:coarse){.copy,.go{min-height:2.75rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script>
/* ============================================================

var PAGE = {
  eyebrow:  "Preview",                                        // small label above the title
  title:    "ADHD-Friendly Money + Life Planner",             // big title
  sub:      "A preview of how the planner will look.",
  button:   "View the preview",                               // text on the white button
  link:     "https://adhdweek.vercel.app/",              // THE LINK ADDRESS
  note:     "Preview only.", // leave "" for none
  // Optional extra links (leave the list empty [] for none):
  more: [
    // { text: "Step-by-step guide", url: "https://example.com/guide" }
  ]
};
/* ============================================================ */

(function(){
  var $=function(id){return document.getElementById(id)};
  document.title="All-In-One-4U · "+PAGE.title;
  $("eyebrow").textContent=PAGE.eyebrow; if(!PAGE.eyebrow) $("eyebrow").style.display="none";
  $("title").textContent=PAGE.title;
  $("sub").textContent=PAGE.sub; if(!PAGE.sub) $("sub").style.display="none";
  var go=$("go"); go.textContent=PAGE.button; go.href=PAGE.link; go.target="_blank";
  $("addr").textContent=PAGE.link;
  $("note").textContent=PAGE.note; if(!PAGE.note) $("note").style.display="none";
  PAGE.more.forEach(function(m){
    var a=document.createElement("a"); a.href=m.url; a.target="_blank"; a.rel="noopener noreferrer"; a.textContent=m.text; $("more").appendChild(a);
  });
  var b=$("copy");
  b.addEventListener("click",function(){
    function done(t){b.textContent=t; setTimeout(function(){b.textContent="Copy link"},1800)}
    function fallback(){
      var t=document.createElement("textarea"); t.value=PAGE.link; t.style.position="fixed"; t.style.opacity="0";
      document.body.appendChild(t); t.select();
      try{document.execCommand("copy"); done("Copied")}catch(e){done("Press and hold the link")}
      document.body.removeChild(t);
    }
    if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(PAGE.link).then(function(){done("Copied")},fallback)}else{fallback()}
  });
})();
</script>
